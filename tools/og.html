<!doctype html>
<!-- Картинка-превью ссылки (og.png 1200x630). Пересобрать: tools/og.html → скриншот 1200x630 (см. README). -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  .c { width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 80px; position: relative; overflow: hidden;
       background: #f6f5f1; font-family: Manrope, sans-serif; color: #0f1222; display: flex; flex-direction: column; }
  .c::before { content: ""; position: absolute; right: -180px; top: -200px; width: 720px; height: 720px; border-radius: 50%;
       background: radial-gradient(closest-side, rgba(35,70,255,.20), rgba(35,70,255,0)); }
  .logo { display: flex; align-items: center; gap: 18px; font-weight: 800; font-size: 40px; letter-spacing: -.03em; position: relative; }
  .mark { width: 64px; height: 64px; border-radius: 18px; background: #2346ff; color: #fff; display: grid; place-items: center; font-size: 38px; }
  .logo span span { color: #2346ff; }
  h1 { font-size: 84px; line-height: 1.02; letter-spacing: -.045em; font-weight: 800; margin: auto 0 0; position: relative; }
  h1 em { font-style: normal; color: #2346ff; }
  .row { display: flex; gap: 14px; margin-top: 38px; position: relative; }
  .pill { font-size: 26px; font-weight: 700; padding: 12px 22px; border-radius: 999px; background: #fff; border: 2px solid #e4e2da; }
  .pill.b { background: #2346ff; color: #fff; border-color: #2346ff; }
</style></head>
<body><div class="c">
  <div class="logo"><div class="mark">K</div><span>Kirdun<span>.dev</span></span></div>
  <h1>Сайты и Telegram‑боты,<br><em>которые приводят клиентов</em></h1>
  <div class="row"><div class="pill b">Демо бесплатно</div><div class="pill">Цены и калькулятор</div><div class="pill">Заказ в Telegram</div></div>
</div>
<script>
  // og.html#en → английская версия (og-en.png)
  if (location.hash === '#en') {
    document.documentElement.lang = 'en';
    document.querySelector('h1').style.fontSize = '78px';
    document.querySelector('h1').innerHTML ='Websites and Telegram bots<br><em>that bring you clients</em>';
    const p = document.querySelectorAll('.pill');
    ['Free demo', 'Clear prices', 'Order on Telegram'].forEach((x, i) => { p[i].textContent = x; });
  }
</script></body></html>
